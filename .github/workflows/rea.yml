name: Preparar REA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rea:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verificar o REA
        run: npx -y rea-agents@6.7.0 doctor
