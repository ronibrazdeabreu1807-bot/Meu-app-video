name: Preparar REA e OpenCode

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preparar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar OpenCode na nuvem
        run: curl -fsSL https://opencode.ai/install | bash

      - name: Verificar OpenCode
        run: |
          export PATH="$HOME/.opencode/bin:$PATH"
          opencode --version

      - name: Verificar REA
        run: npx -y rea-agents@6.7.0 doctor
